<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Deccan Traders</title>

<style>
/* Layout: logo-led masthead with the emblem at left, shop-first home, detail page with sticky cover; palette is white plus the logo's navy and red. */
:root{
  --bg:#FFFFFF;
  --surface:#F6F7FC;       /* white with a trace of the logo navy */
  --fg:#17184A;            /* deep navy ink */
  --muted:#575A83;
  --line:#DADCEC;
  --navy:#30308B;          /* the wordmark blue */
  --accent:#D83834;        /* the logo red */
  --accent-fg:#FFFFFF;
  --deep:#26276F;
  --deep-fg:#FFFFFF;
  --gold:#FFB4AE;          /* light red tint for small text on navy */
  --leaf:#0E8A43;          /* the emblem green, used for WhatsApp actions */
  --good:#0E7A3E;
  --bad:#C0302B;
  --display:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --body:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --script:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;
  --arabic:'Amiri','Noto Naskh Arabic','Traditional Arabic',serif;
  --quran:'Amiri Quran','Amiri','Traditional Arabic',serif;
  --urdu:'Noto Nastaliq Urdu','Amiri','Noto Naskh Arabic',serif;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.mast .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.logo{font-family:var(--display);font-size:22px;background:none;border:0;padding:0;letter-spacing:.01em;white-space:nowrap}
.logo i{color:var(--accent)}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav button{background:none;border:0;padding:10px 10px;font-size:14px;font-weight:500;border-radius:6px;min-height:44px}
.nav button:hover{color:var(--accent)}
.nav .hide-s{display:none}
@media(min-width:640px){.nav .hide-s{display:inline-block}}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:12px;line-height:20px;text-align:center;margin-left:4px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:15px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500}

/* hero */
.hero{display:grid;gap:32px;padding-block:44px 36px;grid-template-columns:1fr;align-items:center}
.hero h1{font-size:clamp(40px,8vw,76px)}
.hero h1 em{color:var(--accent)}
.hero p.lead{font-size:18px;max-width:46ch;margin-top:18px;color:var(--muted)}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.fan{position:relative;height:300px;max-width:420px;width:100%;margin:0 auto}
.fan .cv{position:absolute;width:42%;top:14px;box-shadow:0 18px 30px -12px rgba(0,0,0,.45);border-radius:3px}
.fan .cv:nth-child(1){left:2%;transform:rotate(-9deg)}
.fan .cv:nth-child(2){left:29%;top:0;transform:rotate(0deg);z-index:2}
.fan .cv:nth-child(3){left:56%;transform:rotate(9deg)}
@media(min-width:820px){.hero{grid-template-columns:1.1fr 1fr;padding-block:72px 56px}.fan{height:420px;max-width:520px}}

.strip{background:var(--deep);color:var(--deep-fg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px))}
.strip ul{list-style:none;margin:0 auto;padding:0;max-width:1180px;display:grid;gap:10px 24px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));font-size:14px}
.strip b{color:var(--accent);font-weight:600}

section.block{padding-block:48px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,4.5vw,40px)}

/* grid + cards */
.grid{display:grid;gap:28px 18px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card .cvbtn{background:none;border:0;padding:0;display:block;position:relative}
.cv{display:block;width:100%;aspect-ratio:2/3;border-radius:3px;box-shadow:0 10px 22px -14px rgba(0,0,0,.55)}
.cv svg{display:block;width:100%;height:100%;border-radius:3px}
.card h3{font-size:19px;line-height:1.2}
.card h3 button{background:none;border:0;padding:0;text-align:left;font:inherit;line-height:inherit}
.card h3 button:hover{color:var(--accent)}
.card .by{font-size:14px;color:var(--muted)}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font-size:18px;font-weight:600}
.price s{color:var(--muted);font-size:14px}
.price .off{color:var(--good);font-size:13px;font-weight:600}
.stars{color:var(--accent);letter-spacing:1px;font-size:14px}
.tag{position:absolute;top:8px;left:8px;background:var(--deep);color:var(--deep-fg);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.heart{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;display:grid;place-items:center}
.heart.on{color:#F3B54A}

/* genre list */
.genres{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media(min-width:700px){.genres{grid-template-columns:1fr 1fr;column-gap:40px}}
.genres button{display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;font-family:var(--display);font-size:24px;text-align:left;min-height:56px}
.genres button span{font-family:var(--body);font-size:13px;color:var(--muted)}
.genres button:hover{color:var(--accent)}

/* catalog controls */
.page-title{padding-block:36px 18px}
.page-title h1{font-size:clamp(34px,6vw,56px)}
.controls{display:grid;gap:12px;grid-template-columns:1fr;margin-bottom:14px}
@media(min-width:700px){.controls{grid-template-columns:1fr 220px}}
.field{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
textarea.field{padding:12px 14px;min-height:80px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:18px}
.chip{flex:none;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:20px;background:transparent;font-size:14px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}

/* detail */
.crumbs{padding-block:20px 8px;font-size:14px;color:var(--muted)}
.detail{display:grid;gap:28px;grid-template-columns:1fr;padding-block:8px 24px}
@media(min-width:860px){.detail{grid-template-columns:340px 1fr;gap:56px}.detail .left{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));align-self:start}}
.detail .left .cv{max-width:300px;margin:0 auto;box-shadow:0 26px 40px -20px rgba(0,0,0,.6)}
.detail h1{font-size:clamp(34px,5.5vw,56px)}
.detail .byline{font-size:18px;margin-top:10px}
.detail .byline a{color:var(--accent)}
.meta-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:14px}
.buybox{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:20px;margin-top:22px;display:grid;gap:16px}
.buybox .price b{font-size:32px;font-family:var(--display);font-weight:400}
.fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fmt{border:1px solid var(--line);background:transparent;border-radius:4px;padding:10px 8px;text-align:left;min-height:62px}
.fmt small{display:block;color:var(--muted);font-size:12px}
.fmt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.stepper button{width:40px;height:44px;background:none;border:0;font-size:18px}
.stepper span{min-width:30px;text-align:center}
.stock{font-size:14px;font-weight:600}
.stock.in{color:var(--good)}
.stock.low{color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:34px;overflow-x:auto}
.tabs button{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:12px 14px;font-weight:500;min-height:46px;color:var(--muted)}
.tabs button.on{color:var(--fg);border-color:var(--accent)}
.tabbody{padding-block:20px;max-width:65ch}
.tabbody p+p{margin-top:12px}
dl.spec{display:grid;grid-template-columns:130px 1fr;gap:10px 16px;margin:0}
dl.spec dt{color:var(--muted)}
dl.spec dd{margin:0}
.review{padding-block:14px;border-bottom:1px solid var(--line)}
.review b{font-weight:600}

/* cart */
.cart{display:grid;gap:28px;grid-template-columns:1fr;padding-bottom:24px}
@media(min-width:900px){.cart{grid-template-columns:1fr 380px;gap:48px}}
.line{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding-block:18px;border-bottom:1px solid var(--line);align-items:start}
.line .cv{width:76px}
.line h3{font-size:19px}
.line .sub{font-size:14px;color:var(--muted)}
.line .tot{font-weight:600;text-align:right}
.summary{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:20px;display:grid;gap:12px;align-self:start}
.summary .r{display:flex;justify-content:space-between;gap:12px}
.summary .total{font-size:20px;font-weight:600;border-top:1px solid var(--line);padding-top:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:14px}
.ok{color:var(--good);font-size:14px}

/* checkout */
form.co{display:grid;gap:14px}
form.co label{display:grid;gap:6px;font-size:14px;font-weight:500}
.two{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-size:14px;font-weight:500;margin-bottom:8px;padding:0}
.pm{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:12px 14px;min-height:52px;cursor:pointer}
.pm input{accent-color:var(--accent);width:18px;height:18px}
.pm.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}

/* modal */
.veil{position:fixed;inset:0;z-index:50;background:rgba(5,12,10,.66);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:8px;width:100%;max-width:420px;padding:26px;display:grid;gap:16px;border:1px solid var(--line)}
.modal h2{font-size:28px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;margin:6px auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--deep);color:var(--deep-fg);padding:12px 18px;border-radius:4px;font-size:14px;max-width:calc(100% - 32px)}

/* confirmation */
.done{max-width:620px;margin:0 auto;padding-block:56px;display:grid;gap:18px}
.done h1{font-size:clamp(34px,6vw,54px)}
.seal{width:64px;height:64px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:28px;font-family:var(--display)}

footer{margin:64px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:var(--deep);color:var(--deep-fg);padding:40px max(16px,env(safe-area-inset-left,0px)) 28px}
footer .wrap{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
footer h4{margin:0 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
footer p,footer li{font-size:14px;opacity:.85}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.demo{font-size:12px;opacity:.7;margin-top:22px;max-width:1180px;margin-inline:auto}

/* print-minded refinements: heavier Didone type, square corners, stagger */
h1,h2,h3{font-weight:800;letter-spacing:-.02em}
.logo{font-weight:900;font-size:18px;letter-spacing:.18em;text-transform:uppercase}
.nav button{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.eyebrow{font-weight:700;letter-spacing:.22em;font-size:11.5px}
.hero{padding-block:36px 44px;gap:20px}
.hero h1{font-weight:900;font-size:clamp(58px,17vw,128px);line-height:.9;letter-spacing:-.04em}
.hero h1 em{font-style:italic;font-weight:800;color:var(--accent);letter-spacing:-.03em}
.hero p.lead{font-size:18px;max-width:40ch;margin-top:24px}
@media(min-width:820px){.hero{grid-template-columns:1.3fr 1fr;padding-block:60px 70px}.hero h1{font-size:clamp(84px,9.6vw,132px)}}
.sec-head h2{font-weight:900;font-size:clamp(36px,6.4vw,64px);line-height:.95;letter-spacing:-.035em}
.page-title h1,.detail h1{font-weight:900;letter-spacing:-.035em}
.card h3{font-weight:700;font-size:20px;letter-spacing:-.01em}
.btn,.chip,.fmt,.field,.buybox,.summary,.modal,.stepper,.pm,.tag{border-radius:0}
.btn{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:700;min-height:48px}
.chip{text-transform:uppercase;letter-spacing:.1em;font-size:11.5px;font-weight:600}
.buybox,.summary{background:transparent;border:1px solid var(--fg)}
.genres button{font-weight:800;font-size:clamp(28px,4.4vw,42px);letter-spacing:-.02em}
.price b{font-weight:700}
.tabs button{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:600}
footer h4,.feature .eyebrow{color:var(--gold)}
@media(min-width:700px){.stagger .card:nth-child(even){margin-top:44px}}

.ticker{margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));overflow:hidden;background:var(--deep);color:var(--deep-fg)}
.tk{display:flex;width:max-content}
.tk span{white-space:nowrap;padding:15px 0 15px 22px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
.tk span::after{content:"\2766\FE0E";margin-left:22px;color:var(--gold)}

.feature{margin:56px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;background:var(--deep);color:var(--deep-fg);padding:56px max(16px,env(safe-area-inset-left,0px))}
.feature .in{max-width:1180px;margin:0 auto;display:grid;gap:36px;grid-template-columns:1fr;align-items:center}
@media(min-width:820px){.feature .in{grid-template-columns:360px 1fr;gap:72px}}
.feature .cv{max-width:300px;margin:0 auto;box-shadow:0 30px 50px -20px rgba(0,0,0,.8)}
.feature h2{font-size:clamp(44px,8vw,96px);font-weight:900;line-height:.9;letter-spacing:-.04em;margin:14px 0 20px}
.feature p.lede{font-size:18px;max-width:46ch;opacity:.9}
.feature dl{display:grid;grid-template-columns:auto 1fr;gap:6px 24px;margin:26px 0;font-size:14px}
.feature dt{opacity:.65;text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;padding-top:2px}
.feature dd{margin:0}
.feature .btn{background:var(--gold);border-color:var(--gold);color:#14231E}
.feature .btn.ghost{background:transparent;color:var(--deep-fg);border-color:var(--deep-fg)}

/* type: geometric sans paired with a calligraphic script */
h1,h2{text-transform:uppercase;font-weight:800;letter-spacing:.01em;line-height:1}
h3{font-weight:600;letter-spacing:0;text-transform:none}
.hero h1{font-size:clamp(46px,13.5vw,100px);font-weight:800;line-height:.98;letter-spacing:0}
@media(min-width:820px){.hero h1{font-size:clamp(62px,7.4vw,102px)}}

.sec-head h2{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:.02em;line-height:1.02}
.page-title h1{font-size:clamp(34px,7vw,60px);font-weight:800;letter-spacing:.02em}
.detail h1{font-size:clamp(28px,4.6vw,46px);font-weight:800;letter-spacing:.02em;line-height:1.05}
.feature h2{font-size:clamp(34px,6.4vw,72px);font-weight:800;line-height:1;letter-spacing:.01em;margin:10px 0 20px}
.done h1{font-size:clamp(30px,5.4vw,48px)}
.card h3{font-size:17px;font-weight:600;line-height:1.25;letter-spacing:0}
.logo{font-size:17px}

.sec-head .eyebrow,.page-title .eyebrow,.detail .eyebrow,.done .eyebrow{font-family:var(--script);font-size:clamp(28px,4vw,38px);letter-spacing:0;text-transform:none;font-weight:400;color:var(--accent);line-height:1}
.scr{font-family:var(--script);font-size:clamp(34px,6vw,52px);color:var(--gold);line-height:1}

.genres button{font-size:clamp(22px,3.4vw,32px);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.buybox .price b{font-family:var(--display);font-weight:600}
.modal h2{text-transform:none;font-size:30px}

/* sample reader */
.rd{max-width:720px;margin:0 auto;padding-block:16px 36px}
.rdbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-block:8px}
.sz{display:inline-flex;gap:6px}
.sz button{width:42px;height:42px;border:1px solid var(--line);background:var(--surface);border-radius:0;font-weight:600}
.sheet{background:var(--surface);border:1px solid var(--line);padding:clamp(24px,6vw,56px);margin-top:10px;min-height:58vh;box-shadow:0 22px 40px -30px rgba(0,0,0,.55)}
.sheet p{margin:0 0 1.15em;line-height:1.85;font-size:var(--rs,18px);white-space:pre-line;overflow-wrap:anywhere}
.sheet .ch{font-family:var(--script);font-size:clamp(44px,9vw,68px);color:var(--accent);line-height:1;margin:0}
.sheet .ct{font-size:12px;letter-spacing:.26em;margin:4px 0 30px;color:var(--muted);font-weight:600;line-height:1.5}
.sheet .run{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.sheet .pt{font-size:clamp(26px,5vw,38px);margin-bottom:18px;font-family:var(--script);font-weight:400;color:var(--accent);line-height:1.1}
.sheet .dc{float:left;font-family:var(--script);font-size:4.8em;line-height:.7;padding:.1em .1em 0 0;color:var(--accent)}
.sheet .pn{text-align:center;font-size:12px;letter-spacing:.2em;color:var(--muted);margin:32px 0 0}
.rdnav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.dots{display:flex;gap:9px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.endcard{border:1px solid var(--fg);padding:24px;margin-top:20px;display:grid;gap:12px}
.endcard h3{font-size:20px}

/* publisher site sections */
.promo{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--accent);color:var(--accent-fg);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));font-size:13px;font-weight:600;letter-spacing:.03em;text-align:center}
.promo button{background:none;border:1px solid currentColor;color:inherit;min-height:34px;padding:0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.stats{display:flex;gap:10px 30px;flex-wrap:wrap;margin-top:34px}
.stats b{display:block;font-size:clamp(28px,4.6vw,42px);font-weight:800;line-height:1}
.stats span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.trust{display:flex;gap:10px 28px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-block:1px solid var(--fg);padding-block:16px;font-size:14px}
.trust .stars{font-size:15px}
.strip4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 16px}
@media(min-width:700px){.strip4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip4 button{background:none;border:0;padding:0;text-align:left;display:grid;gap:8px;align-content:start}
.strip4 small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:4px}
.strip4 b{font-weight:600;font-size:16px;line-height:1.25}
.pain{display:grid;grid-template-columns:1fr;border-top:1px solid var(--fg)}
.pain>div{padding:24px 0;border-bottom:1px solid var(--line)}
.pain h3{font-size:clamp(20px,2.4vw,26px);line-height:1.2;font-weight:700;margin-bottom:10px}
.pain p{color:var(--muted);font-size:15px;max-width:44ch}
@media(min-width:800px){.pain{grid-template-columns:repeat(3,1fr)}.pain>div{border-bottom:0;padding:28px 26px 28px 0}.pain>div+div{border-left:1px solid var(--line);padding-left:26px}}
.solve{background:var(--deep);color:var(--deep-fg);margin:56px calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:56px max(16px,env(safe-area-inset-left,0px))}
.solve .in{max-width:1180px;margin:0 auto;display:grid;gap:30px;grid-template-columns:1fr}

.solve h2{font-size:clamp(30px,5vw,54px);margin-top:6px}

.solve .btn{background:var(--gold);border-color:var(--gold);color:#14231E}
.tagz{display:flex;flex-wrap:wrap;gap:8px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-top:1px solid var(--fg)}

.cta-band{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap;border:1px solid var(--fg);padding:28px;margin-top:44px}
.cta-band h2{font-size:clamp(22px,3.6vw,34px)}
.quotes{display:grid;gap:22px;grid-template-columns:1fr}

.quotes cite{display:block;margin-top:10px;font-style:normal;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.svcs{display:grid;grid-template-columns:1fr;border-top:1px solid var(--fg)}
@media(min-width:700px){.svcs{grid-template-columns:1fr 1fr;column-gap:48px}}
.svc{padding:20px 0;border-bottom:1px solid var(--line)}
.svc h3{font-size:20px;font-weight:700}
.svc p{color:var(--muted);font-size:15px;margin-top:4px}
.pkgs{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:900px){.pkgs{grid-template-columns:repeat(3,1fr)}}
.pkg{border:1px solid var(--fg);padding:26px;display:grid;gap:14px;align-content:start;background:var(--surface)}
.pkg.pop{background:var(--deep);color:var(--deep-fg)}
.pkg .pn2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.pkg.pop .pn2{color:var(--gold)}
.pkg .amt{font-size:44px;font-weight:800;line-height:1}
.pkg ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.pkg li::before{content:"\2713\FE0E";margin-right:10px;color:var(--accent);font-weight:700}
.pkg.pop li::before{color:var(--gold)}
.pkg.pop .btn{background:var(--gold);border-color:var(--gold);color:#14231E}
.calc{display:grid;gap:30px;grid-template-columns:1fr}

.calc label{display:grid;gap:8px;font-size:14px;font-weight:500;margin-bottom:20px}
.calc label>span{display:flex;justify-content:space-between}
.calc input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.rout{border:1px solid var(--fg);padding:24px;display:grid;gap:14px;align-self:start}
.rout .big{font-size:52px;font-weight:800;line-height:1}
.rout .r{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.post summary{cursor:pointer;list-style:none;padding:20px 0;border-bottom:1px solid var(--line);display:grid;gap:4px;min-height:48px}

.post summary small{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.post summary b{font-size:clamp(20px,3vw,28px);font-weight:700;line-height:1.2}
.post .pb{padding:18px 0 10px;max-width:65ch}
.post .pb p+p{margin-top:12px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:16px 0;font-weight:600;min-height:48px;display:flex;align-items:center}
.faq details p{padding:0 0 16px;color:var(--muted);max-width:65ch}
.cdet{display:grid;gap:18px;align-content:start}
.cdet b{display:block;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bg);border-top:1px solid var(--fg);display:grid;grid-template-columns:repeat(5,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.bnav button{background:none;border:0;min-height:54px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}

@media(max-width:999px){#foot{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}}
#help{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:40;display:grid;gap:10px;justify-items:end}

.hbtn{min-height:48px;padding:0 20px;background:var(--fg);color:var(--bg);border:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.6)}
.hpanel{width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--fg);padding:18px;display:grid;gap:8px}
.hpanel[hidden]{display:none}
.hpanel h3{font-family:var(--script);font-size:34px;font-weight:400;color:var(--accent);line-height:1}
.hpanel button{text-align:left;background:none;border:1px solid var(--line);padding:12px 14px;min-height:46px;font-size:14px;font-weight:500}
.hpanel button:hover{border-color:var(--accent)}
.nav .dk{display:none}
@media(min-width:1000px){.nav .dk{display:inline-block}}

.fl{background:none;border:0;color:inherit;opacity:.85;text-align:left;padding:4px 0;font:inherit;font-size:14px;min-height:32px}
.fl:hover{opacity:1;color:var(--gold)}

/* loading page: white ground and the logo's own navy and red, the same in light and dark by design */
:root{--ld-bg:#FFFFFF;--ld-navy:#30308B;--ld-red:#D83834;--ld-ink:#6A6D96}
html.ld,html.ld body{overflow:hidden}
#loader{position:fixed;inset:0;z-index:100;background:var(--ld-bg);display:grid;place-items:center;padding:24px 16px}
#loader.out{opacity:0;pointer-events:none;transition:opacity .6s ease}
.lg{position:relative;width:min(88vw,760px);aspect-ratio:792/310;max-width:100%}
.lg svg,.lg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.lg svg{display:none}
.lg path{fill:none;stroke-width:var(--sw,1.6);stroke-linejoin:round}
.lg path.n{stroke:var(--ld-navy);--fc:var(--ld-navy)}
.lg path.r{stroke:var(--ld-red);--fc:var(--ld-red)}
.lg path.h{--fc:var(--ld-bg)}
.ldskip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));min-height:44px;padding:0 18px;background:none;border:0;color:var(--ld-ink);font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
.ldskip:hover{color:var(--ld-navy)}
.ldskip:focus-visible{outline:2px solid var(--ld-red);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .lg svg{display:block;animation:ld-svgout .45s 3.05s ease both}
  .lg path{stroke-dasharray:1 1;stroke-dashoffset:1;fill:var(--fc);fill-opacity:0;
    animation:ld-draw .85s calc(var(--d,0s) + .2s) cubic-bezier(.45,.05,.3,1) both,ld-fill .6s 2.3s ease both,ld-ink .6s 2.3s ease both}
  .lg img{opacity:0;animation:ld-imgin .9s 2.65s ease both}
  .ldskip{opacity:0;animation:ld-skipin .6s 1s ease both}
  @keyframes ld-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes ld-fill{from{fill-opacity:0}to{fill-opacity:1}}
  @keyframes ld-ink{to{stroke-opacity:0}}
  @keyframes ld-svgout{to{opacity:0}}
  @keyframes ld-imgin{from{opacity:0;filter:blur(9px);transform:scale(1.015)}to{opacity:1;filter:blur(0);transform:none}}
  @keyframes ld-skipin{to{opacity:1}}
}

.emb.big{height:132px}
.logo{display:flex;align-items:center;gap:12px;min-height:74px;padding:6px 0;font-family:var(--body);font-size:inherit;font-weight:400;letter-spacing:0;text-transform:none;text-align:left;white-space:normal;color:var(--fg)}
.logo .emb{height:60px}
.logo .lt{display:block}
.logo .lt b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(15px,4.3vw,20px);letter-spacing:.07em;text-transform:uppercase;color:var(--navy);line-height:1.05}
.logo .lt small{display:block;margin-top:4px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.mast{border-bottom:1px solid var(--navy);box-shadow:0 3px 0 var(--accent)}
.mast .wrap{min-height:80px}
a.btn{text-decoration:none}
.btn.wa{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn .wi{width:18px;height:18px;flex:none}
.feature .btn,.solve .btn,.pkg.pop .btn{background:#fff;border-color:#fff;color:var(--deep)}
.feature .btn.wa{background:var(--leaf);border-color:var(--leaf);color:#fff}
.promo{background:var(--navy);color:#fff}
.promo a,.promo button{background:none;border:1px solid currentColor;color:inherit;min-height:34px;padding:0 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:inline-flex;align-items:center;text-decoration:none}
.lang{font-size:13px;color:var(--muted)}
.shops{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:760px){.shops{grid-template-columns:1fr 1fr}.shops.one{grid-template-columns:1fr}}
.shopc{border:1px solid var(--fg);padding:24px;display:grid;gap:10px;align-content:start;background:var(--surface);min-width:0}
.shopc h3{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
.shopc .scr{font-size:34px;color:var(--accent);line-height:1}
.shopc .row .btn{flex:1;min-width:130px}
.artitle{font-family:var(--arabic);font-size:30px;line-height:1.5;color:var(--navy);margin:8px 0 0;text-align:left}
.artitle.ur{font-family:var(--urdu);font-size:24px;line-height:2.1}
.fmts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.hbtn{background:var(--leaf);color:#fff;display:inline-flex;align-items:center;gap:8px}
.hbtn .wi{width:18px;height:18px}
.hpanel a{display:grid;gap:2px;text-decoration:none;border:1px solid var(--line);padding:12px 14px;min-height:46px;font-size:14px;font-weight:600;color:var(--fg)}
.hpanel a small{font-weight:500;color:var(--muted);letter-spacing:.04em}
.hpanel a:hover{border-color:var(--leaf)}
a.fl{text-decoration:underline;text-underline-offset:3px}
.sheet p.ar{font-family:var(--quran);font-size:calc(var(--rs,18px)*1.85);line-height:2.3;text-align:center;margin:0 0 1em;white-space:pre-line;color:var(--navy)}
.sheet p.ar.a{font-family:var(--arabic);font-size:calc(var(--rs,18px)*2.1);line-height:2.1}
.sheet p.cap{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:1.4em}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-bottom:1.2em}
.letters span{border:1px solid var(--line);text-align:center;padding:10px 4px 8px;background:var(--bg)}
.letters b{display:block;font-family:var(--arabic);font-size:calc(var(--rs,18px)*2.4);line-height:1.35;font-weight:400;color:var(--navy)}
.letters small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

[hidden]{display:none!important}
/* account */
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;margin-right:6px;letter-spacing:0;vertical-align:middle}
.gbtn{background:#fff;color:var(--fg);border:1px solid var(--line);gap:12px}
.gbtn:hover{border-color:var(--navy);filter:none}
.gmono{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--navy);color:var(--navy);font-weight:800;font-size:12px;letter-spacing:0}
.acct-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding-block:36px 8px}
.acct-head .who{display:flex;gap:16px;align-items:center}
.bigav{width:60px;height:60px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--script);font-size:38px;line-height:1;flex:none}
.ord{border:1px solid var(--line);background:var(--surface);padding:18px 20px;display:grid;gap:10px;margin-bottom:14px}
.ord .oh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:3px 9px;border:1px solid var(--good);color:var(--good)}
.ol{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.rent-row{display:grid;grid-template-columns:72px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}
.rent-row .cv{width:72px}
.left-bar{height:5px;background:var(--line);margin-top:10px;max-width:320px}
.left-bar i{display:block;height:100%;background:var(--accent)}
/* rental */
.rgrid{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.rgrid{grid-template-columns:1fr 1fr}}
.rcard{display:grid;grid-template-columns:112px 1fr;gap:18px;border:1px solid var(--line);background:var(--surface);padding:18px;align-items:start;min-width:0}
@media(max-width:420px){.rcard{grid-template-columns:86px 1fr;gap:12px;padding:14px}}
.rcard .cvbtn{background:none;border:0;padding:0;display:block}
.rcard h3{font-size:20px;font-weight:700;line-height:1.2;margin-top:2px}
.rs{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
.dur{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.dbtn{border:1px solid var(--line);background:#fff;padding:8px 4px;text-align:center;min-height:58px;font-size:13px;border-radius:0}
.dbtn b{font-size:18px}
.dbtn small{display:block;color:var(--muted);font-size:12px}
.dbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rfoot .rp{font-size:26px;font-weight:700}
.rentbox{border:1px dashed var(--navy);padding:14px;display:grid;gap:8px}
.rentbox .rb-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.rentbox .dur{margin:2px 0}
.rsteps{display:grid;grid-template-columns:1fr;border-top:1px solid var(--fg)}
@media(min-width:800px){.rsteps{grid-template-columns:repeat(3,1fr)}}
.rsteps>div{padding:18px 18px 18px 0}
.rsteps i{font-style:normal;font-family:var(--script);font-size:46px;color:var(--accent);line-height:1;display:block}
.rsteps h3{font-size:18px;font-weight:700;margin:4px 0}
.rsteps p{font-size:14px;color:var(--muted)}
.sheet{position:relative;overflow:hidden}
.wm{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-24deg);font-size:clamp(14px,3.6vw,24px);letter-spacing:.3em;opacity:.06;pointer-events:none;text-transform:uppercase;font-weight:700;white-space:nowrap}
/* publish */
.pubgrid{display:grid;gap:30px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.pubgrid{grid-template-columns:1fr 400px;gap:52px}.pubside{position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}}
.pubside{border:1px solid var(--fg);padding:22px;display:grid;gap:12px;background:var(--surface);min-width:0}
form.co .svcsel{display:flex;flex-wrap:wrap;gap:8px}
form.co .svcsel label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 12px;font-size:14px;font-weight:500;background:var(--surface);cursor:pointer;min-height:42px}
.svcsel input{accent-color:var(--accent);width:16px;height:16px}
.wapre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--body);font-size:14px;line-height:1.6;margin:0;background:#fff;border:1px solid var(--line);padding:14px;max-height:320px;overflow:auto}
/* location plate */
.atlas{display:grid;gap:26px;grid-template-columns:1fr;align-items:start}
@media(min-width:900px){.atlas{grid-template-columns:1.4fr 1fr;gap:44px}}
.plate{padding:14px;min-width:0}
.plate svg{display:block;width:100%;height:auto;overflow:visible}
.plate .cap{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:14px;font-weight:600}
.atlas .pbg{fill:var(--surface)}
.atlas .frame{fill:none;stroke:var(--navy);stroke-width:1.2}
.atlas .crop{fill:none;stroke:var(--navy);stroke-width:1}
.atlas .riv1{fill:none;stroke:var(--navy);stroke-opacity:.35;stroke-width:17;stroke-linecap:round}
.atlas .riv2{fill:none;stroke:#E1E5F6;stroke-width:15;stroke-linecap:round}
.atlas .ln{fill:none;stroke:var(--navy);stroke-opacity:.2;stroke-width:1}
.atlas .rd1{fill:none;stroke:var(--navy);stroke-opacity:.4;stroke-width:9;stroke-linecap:round}
.atlas .rd2{fill:none;stroke:var(--surface);stroke-width:7;stroke-linecap:round}
.atlas .ic{fill:none;stroke:var(--navy);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.atlas .route{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1 7}
.atlas .pin{cursor:pointer}
.atlas .pf1{fill:var(--accent)}
.atlas .pf2{fill:var(--navy)}
.atlas .ring{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:0}
.atlas .pin.sel .ring{opacity:.55}
.atlas .lbl{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--navy);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.atlas .sm{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;fill:var(--navy);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.atlas .scrl{font-family:var(--script);fill:var(--navy)}
.atabs{display:flex;gap:8px;flex-wrap:wrap}
.acard{border:1px solid var(--fg);padding:22px;display:grid;gap:10px;background:var(--surface);min-width:0}
.acard h3{font-size:30px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}
.acard .scr{font-size:34px;color:var(--accent);line-height:1}
.acard .row .btn{flex:1;min-width:140px}

.nav button{white-space:nowrap}
.nav{gap:2px}

/* motion: everything here is skipped for people who ask for reduced motion */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes fan1{from{opacity:0;transform:translate(70%,40px) rotate(0) scale(.85)}to{opacity:1;transform:rotate(-9deg)}}
  @keyframes fan2{from{opacity:0;transform:translateY(50px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes fan3{from{opacity:0;transform:translate(-70%,40px) rotate(0) scale(.85)}to{opacity:1;transform:rotate(9deg)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes shimmer{0%{background-position:120% 0}100%{background-position:-120% 0}}
  @keyframes coverIn{from{opacity:0;transform:perspective(900px) rotateY(-42deg) translateX(-30px)}to{opacity:1;transform:none}}
  @keyframes heartpop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}
  @keyframes badgepop{0%{transform:scale(1)}40%{transform:scale(1.7)}100%{transform:scale(1)}}
  @keyframes grow{from{width:0}}
  @keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes toastout{to{opacity:0}}
  @keyframes sealin{from{opacity:0;transform:scale(.4) rotate(-40deg)}to{opacity:1;transform:none}}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(216,56,52,.5)}100%{box-shadow:0 0 0 26px rgba(216,56,52,0)}}

  #app.enter{animation:fade .35s both}
  .enter .hero .eyebrow{animation:rise .7s .05s both}
  .enter .hero h1{animation:rise .8s .15s both}
  .enter .hero p.lead{animation:rise .8s .3s both}
  .enter .hero .cta{animation:rise .8s .45s both}
  .enter .hero .fan .cv:nth-child(1){animation:fan1 1.1s .25s cubic-bezier(.2,.8,.2,1) both}
  .enter .hero .fan .cv:nth-child(2){animation:fan2 1.1s .4s cubic-bezier(.2,.8,.2,1) both}
  .enter .hero .fan .cv:nth-child(3){animation:fan3 1.1s .55s cubic-bezier(.2,.8,.2,1) both}
  .fan{animation:float 7s 1.6s ease-in-out infinite}
  .tk{animation:tick 44s linear infinite}
  @keyframes tick{to{transform:translateX(-50%)}}

  .enter .detail .left .cv{animation:coverIn .95s cubic-bezier(.2,.8,.2,1) backwards}
  .enter .detail .eyebrow{animation:rise .6s .1s both}
  .enter .detail h1{animation:rise .7s .18s both}
  .enter .detail .byline,.enter .detail .meta-row{animation:rise .7s .28s both}
  .enter .detail .buybox{animation:rise .8s .38s both}
  .detail .left{perspective:900px}
  .detail .left .cv{transition:transform .18s ease-out,box-shadow .3s}
  .tabbody.fade{animation:fade .35s both}

  @keyframes pindrop{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
  @keyframes flow{to{stroke-dashoffset:-16}}
  @keyframes ringp{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.7);opacity:0}}
  .enter .atlas .pin{animation:pindrop .7s .35s cubic-bezier(.3,1.4,.5,1) both}
  .enter .atlas .pin[data-s="branch"]{animation-delay:.6s}
  .atlas .route{animation:flow 2.6s linear infinite}
  .atlas .pin.sel .ring{animation:ringp 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  .rcard{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
  .rcard:hover{transform:translateY(-4px);box-shadow:0 18px 30px -22px rgba(23,24,74,.5)}
  .sheet.tn{animation:turnN .5s cubic-bezier(.2,.8,.2,1)}
  .sheet.tp{animation:turnP .5s cubic-bezier(.2,.8,.2,1)}
  @keyframes turnN{from{opacity:0;transform:translateX(36px) rotateY(-6deg)}to{opacity:1;transform:none}}
  @keyframes turnP{from{opacity:0;transform:translateX(-36px) rotateY(6deg)}to{opacity:1;transform:none}}
  .enter .rd .sheet{animation:rise .7s both}

  .card .cv{transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s}
  .card:hover .cv{transform:translateY(-8px) rotate(-1.5deg);box-shadow:0 28px 36px -16px rgba(0,0,0,.6)}
  .btn{transition:transform .2s,filter .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.97)}
  .genres button{transition:padding-left .3s,color .2s}
  .genres button:hover{padding-left:14px}
  .heart.pop{animation:heartpop .45s}
  .badge.pop{animation:badgepop .5s}
  .enter .bar i{animation:grow 1s .2s cubic-bezier(.2,.8,.2,1) both}
  .veil{animation:fade .25s both}
  .modal{animation:pop .4s cubic-bezier(.2,.8,.2,1) both}
  .toast{animation:toastin .35s both,toastout .3s 1.9s forwards}
  .done .seal{animation:sealin .8s cubic-bezier(.2,.8,.2,1) both,ring 2.2s 1s ease-out 2}
  .done>*:not(.seal){animation:rise .7s both}
  .done>*:nth-child(2){animation-delay:.25s}
  .done>*:nth-child(3){animation-delay:.35s}
  .done>*:nth-child(4){animation-delay:.45s}
  .done>*:nth-child(5){animation-delay:.55s}
  .done>*:nth-child(6){animation-delay:.65s}

  /* scroll-linked reveal where the browser supports it; elsewhere everything is simply visible */
  @supports (animation-timeline:view()){
    .sec-head,.card,.genres button,.line,.summary,.pain>div,.step,.pkg,.svc,.quotes blockquote{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
    .enter .hero .fan,.enter .hero .cta{animation-timeline:auto}
  }
}

 {id:'b3',t:'Tafheem-ul-Quran',ar:'تفہیم القرآن',a:'Sayyid Abul A’la Maududi',ca:'Maududi',g:'Tafsir',lang:'Urdu',ur:true,pal:['#4A1620','#A63D4E','#F3DCC0'],m:'arch',
  o:[{f:'Complete set',p:2800,m:3300,n:'Multi-volume, hardcover'}],
  d:`A commentary on the Quran in Urdu, written by Sayyid Abul A'la Maududi (1903–1979) over about three decades. It presents the Arabic text with an Urdu translation, an introduction to each surah, and explanatory notes.

Each surah opens with its background and main themes, and footnotes explain verses, language and historical references.`,
  gd:{au:`Sayyid Abul A'la Maududi was born in 1903 in Aurangabad, in the Deccan, and wrote widely in Urdu on Islam, society and the Quran. Tafheem-ul-Quran is his best-known work and has been translated into many languages.`,
      in:`Introductions to every surah covering the setting of its revelation and its themes. The Urdu translation reads as continuous prose, and notes at the foot of the page explain verses, terms and references.`,

 {id:'b4',t:'Tafsir Ibn Kathir',sub:'Abridged, English',ar:'تفسير ابن كثير',a:'Ismail ibn Kathir',ca:'Ibn Kathir',g:'Tafsir',lang:'English',pal:['#0C3A44','#2A8590','#E9E2BC'],m:'lattice',
  o:[{f:'Complete set',p:9500,m:11000,n:'Multi-volume, hardcover'}],
  d:`One of the most widely used classical commentaries on the Quran, by the fourteenth-century scholar Ismail ibn Kathir, available here in an abridged English edition.

  gd:{au:`Ismail ibn Umar ibn Kathir (about 1300–1373 CE) was a Syrian scholar of Quranic commentary, hadith and history. His historical work Al-Bidaya wa'l-Nihaya is also widely read.`,
      in:`Verse-by-verse commentary that follows the order of the Quran, with the Arabic text and English meanings. Abridged editions shorten the chains of narration so the explanation reads more smoothly.`,
      fw:`Students and families who want a classical, hadith-based explanation in English. It works well as a reference to read alongside a surah you are studying.`}},
 {id:'b5',t:'Sahih al-Bukhari',ar:'صحيح البخاري',a:'Imam Muhammad ibn Ismail al-Bukhari',ca:'Al-Bukhari',g:'Hadith',lang:'Arabic · English',pal:['#3A2414','#8E5A2B','#F1E0B8'],m:'dome',
  o:[{f:'Complete set',p:7200,m:8500,n:'Multi-volume, hardcover'}],
  d:`Sahih al-Bukhari is a collection of the sayings and actions of the Prophet (peace be upon him), compiled by Imam Muhammad ibn Ismail al-Bukhari. Scholars of hadith regard it as among the most authentic collections.

Arabic–English editions place the Arabic text beside the translation.`,
  gd:{au:`Imam al-Bukhari (810–870 CE) was born in Bukhara, in present-day Uzbekistan, and travelled for years to gather and verify narrations before compiling this book.`,
      in:`Narrations are arranged in books by subject: revelation, faith, knowledge, prayer, fasting, pilgrimage, trade, family life, character and more. The Arabic text appears beside an English translation.`,
      fw:`Readers and students who want a primary source. Reading by topic, with a teacher's guidance, makes a large collection easier to approach.`}},
 {id:'b6',t:'Riyad as-Salihin',sub:'Gardens of the Righteous',ar:'رياض الصالحين',a:'Imam Yahya ibn Sharaf an-Nawawi',ca:'An-Nawawi',g:'Hadith',lang:'Arabic · English',pal:['#10402A','#3A9461','#F1E6B6'],m:'rosette',
  o:[{f:'Hardcover',p:650,m:780,n:'Arabic–English'}],
  d:`Riyad as-Salihin, "The Gardens of the Righteous", gathers verses of the Quran and hadith by theme, with chapters on sincerity, repentance, patience, good manners, family ties, prayer and remembrance.

A favourite for daily reading in homes, mosques and study circles.`,
  gd:{au:`Imam Yahya ibn Sharaf an-Nawawi (1233–1277 CE) was a scholar of hadith and Shafi'i law who taught in Damascus and wrote several works that are still studied widely today.`,
      in:`Short chapters on sincerity, repentance, patience, truthfulness, good manners, kindness to family and neighbours, prayer, remembrance and more. Each chapter opens with relevant verses and follows with hadith.`,

 {id:'b7',t:'Forty Hadith of Imam Nawawi',ar:'الأربعون النووية',a:'Imam Yahya ibn Sharaf an-Nawawi',ca:'An-Nawawi',g:'Hadith',lang:'Arabic · English',pal:['#152050','#4260B8','#EFE3B4'],m:'star8',

 {id:'b8',t:'Ar-Raheeq Al-Makhtum',sub:'The Sealed Nectar',ar:'الرحيق المختوم',a:'Safiur Rahman al-Mubarakpuri',ca:'Al-Mubarakpuri',g:'Seerah',lang:'English · Urdu',tag:'Popular',pal:['#0A2E3A','#1F6C7D','#F0E2AE'],m:'crescent',

  gd:{au:`Safiur Rahman al-Mubarakpuri (1942–2006) was a scholar from Mubarakpur in Uttar Pradesh, India. This book is the work he is best known for.`,

 {id:'b9',t:'Stories of the Prophets',ar:'قصص الأنبياء',a:'Ismail ibn Kathir',ca:'Ibn Kathir',g:'Seerah',lang:'English',pal:['#2B1B4D','#6A4BB0','#F0E2C0'],m:'arch',

 {id:'b10',t:'Hisn al-Muslim',sub:'Fortress of the Muslim',ar:'حصن المسلم',a:'Dr. Sa’id ibn Ali ibn Wahf al-Qahtani',ca:'Al-Qahtani',g:'Dua & Dhikr',lang:'Arabic · English',pal:['#17214F','#3D63B2','#F2E4B4'],m:'lattice',

 {id:'b12',t:'Fazail-e-Amaal',ar:'فضائل اعمال',a:'Maulana Muhammad Zakariyya Kandhlawi',ca:'Zakariyya Kandhlawi',g:'Faith & Practice',lang:'Urdu',ur:true,pal:['#0C3C3C','#238A86','#F0E4B8'],m:'star8',

function fly(src){
  var tgt=document.querySelector('.nav [data-v="cart"]');
  if(RM||!src||!tgt||!src.animate)return bump();
  var a=src.getBoundingClientRect(),b=tgt.getBoundingClientRect(),c=src.cloneNode(true);
  c.style.cssText='position:fixed;z-index:70;pointer-events:none;margin:0;transition:none;animation:none;left:'+a.left+'px;top:'+a.top+'px;width:'+a.width+'px;height:'+a.height+'px';
  document.body.appendChild(c);
  var dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);
  var an=c.animate([
    {transform:'translate(0,0) scale(1) rotate(0)',opacity:1},
    {transform:'translate('+(dx*.55)+'px,'+(dy*.55-50)+'px) scale(.45) rotate(8deg)',opacity:.95,offset:.6},
    {transform:'translate('+dx+'px,'+dy+'px) scale(.06) rotate(14deg)',opacity:.3}
  ],{duration:750,easing:'cubic-bezier(.45,0,.7,.4)'});
  an.onfinish=function(){c.remove();bump()};
}

function finish(order){
  var now=Date.now();order.at=now;order.status='Confirmed';

}

  else if(a==='helptoggle'){var hp=document.querySelector('.hpanel');hp.hidden=!hp.hidden;t.setAttribute('aria-expanded',String(!hp.hidden))}
  else if(a==='topic'){S.topic=d.t;document.querySelector('.hpanel').hidden=true;S.v='contact';render()}
  else if(a==='promoX'){S.promoOff=true;var pm=t.closest('.promo');if(pm)pm.remove()}
  else if(a==='read'||a==='readid'){if(d.id)S.id=d.id;S.rmode=null;S.page=0;S.v='read';render()}
  else if(a==='rdclose'){if(S.rmode){S.rmode=null;S.atab='rentals';S.v='account'}else S.v='detail';render()}
  else if(a==='rdnav'){turn(Number(d.d))}
  else if(a==='rdsz'){S.sz=Math.max(0,Math.min(2,S.sz+Number(d.d)));lsSet('hq_sz',S.sz);render(true)}
  else if(a==='addfull'){addToCart(S.id,bookBy(S.id).o[0].f,1);refreshBadges();bump();toast('Added to cart')}
  else if(a==='buyfull'){addToCart(S.id,bookBy(S.id).o[0].f,1);S.v='checkout';render()}
  else if(a==='tab'){S.tab=d.t;render(true);var tb=document.querySelector('.tabbody');if(tb)tb.classList.add('fade')}
  else if(a==='dq'){S.qty=Math.max(1,Math.min(10,S.qty+Number(d.d)));render(true)}
  else if(a==='wish'){var i=S.wish.indexOf(d.id),added=i<0;if(added)S.wish.push(d.id);else S.wish.splice(i,1);save();render(true);if(added)document.querySelectorAll('.heart[data-id="'+d.id+'"]').forEach(function(h){h.classList.add('pop')})}
  else if(a==='cq'){var c=S.cart[Number(d.i)];c.q=Math.max(1,Math.min(10,c.q+Number(d.d)));save();render(true)}
  else if(a==='rm'){S.cart.splice(Number(d.i),1);save();render(true)}
  else if(a==='coupon'){var v=$('#cp').value.trim().toUpperCase();if(v==='WELCOME10'){S.coupon=v;S.err=''}else{S.coupon=null;S.err=v?'That code is not valid.':'Enter a code first.'}save();render(true)}
  else if(a==='pin'){var p=$('#pin').value.trim();S.pin=/^\d{6}$/.test(p)?{ok:true,msg:'Delivers to '+p+' in 3–5 working days.'}:{ok:false,msg:'Enter a valid 6-digit PIN code.'};render(true)}
});
document.addEventListener('input',function(e){
  if(e.target.closest&&e.target.closest('#pf'))pubUpdate();
  if(e.target.closest&&e.target.closest('#ct'))ctUpdate();
  if(e.target.id==='q'){S.q=e.target.value;$('#grid').innerHTML=gridHtml()}
});
document.addEventListener('change',function(e){
  if(e.target.closest&&e.target.closest('#pf'))pubUpdate();
  if(e.target.closest&&e.target.closest('#ct'))ctUpdate();
  if(e.target.id==='sort'){S.sort=e.target.value;$('#grid').innerHTML=gridHtml()}
  if(e.target.name==='pay'){S.pay=e.target.value;var keep={};['f_name','f_ph','f_em','f_ad','f_ct','f_pn'].forEach(function(k){var el=$('#'+k);if(el)keep[k]=el.value});render(true);Object.keys(keep).forEach(function(k){var el=$('#'+k);if(el)el.value=keep[k]})}
});
document.addEventListener('submit',function(e){
  if(e.target.id==='pf'||e.target.id==='ct'){e.preventDefault();return}
  if(e.target.id==='si'){
    e.preventDefault();var nm=$('#g_name').value.trim(),em=$('#g_em').value.trim().toLowerCase(),ge=$('#gerr');
    if(nm.length<2){ge.textContent='Enter your name.';return}
    if(!/^\S+@\S+\.\S+$/.test(em)){ge.textContent='Enter a valid email address.';return}
    var had=signIn(nm,em);$('#layer').innerHTML='';toast(had?'Welcome back, '+nm.split(' ')[0]+'. Your saved cart is back.':'Signed in as '+nm.split(' ')[0]);render(true);return;
  }
  if(e.target.id!=='co')return;e.preventDefault();
  var T=totals(),v=function(k){var el=$('#'+k);return el?el.value.trim():''},er=$('#coerr');
  if(v('f_name').length<2)return er.textContent='Enter your full name.';
  if(!/^[6-9]\d{9}$/.test(v('f_ph')))return er.textContent='Enter a valid 10-digit mobile number.';
  if(!/^\S+@\S+\.\S+$/.test(v('f_em')))return er.textContent='Enter a valid email address.';
  if(T.phys){if(v('f_ad').length<8)return er.textContent='Enter your full delivery address.';if(!v('f_ct'))return er.textContent='Enter your city.';if(!/^\d{6}$/.test(v('f_pn')))return er.textContent='Enter a valid 6-digit PIN code.'}
  er.textContent='';
  if(T.rent&&!S.user){er.textContent='Sign in to rent e-books.';return}
  payModal({id:'DT-'+String(Date.now()).slice(-7),name:v('f_name'),email:v('f_em'),total:T.total,pay:S.pay,phys:T.phys,items:lines().map(function(l){return {id:l.b.id,t:l.b.t,f:l.f,q:l.q,u:l.u,rent:l.rent||0}})});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('#layer').innerHTML='';var hp2=document.querySelector('.hpanel');if(hp2)hp2.hidden=true}if(S.v==='read'&&!e.target.closest('input,textarea,select')){if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1)}});

render(true);
})();
</script>
<script>
(function(){
  var L=document.getElementById('loader');if(!L)return;
  var de=document.documentElement,svg=L.querySelector('svg'),done=false,t1;
  function sw(){var w=svg.getBoundingClientRect().width||760;svg.style.setProperty('--sw',Math.max(1.3,1.35*792/w).toFixed(2))}
  sw();window.addEventListener('resize',sw);
  function end(){
    if(done)return;done=true;clearTimeout(t1);
    de.classList.remove('ld');L.classList.add('out');
    var app=document.getElementById('app');
    if(app){app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter')}
    setTimeout(function(){L.remove()},700);
  }
  var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  t1=setTimeout(end,rm?1000:4300);
  L.addEventListener('click',end);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')end()});
})();
</script>
